apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  labels:
    app.kubernetes.io/name: urumi
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  GATEWAY_SECRET_KEY: {{ .Values.secrets.gatewaySecretKey | quote }}
  ADMIN_PASSWORD: {{ .Values.secrets.adminPassword | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  MYSQL_ROOT_PASSWORD: {{ .Values.secrets.mysqlRootPassword | quote }}
  MYSQL_PASSWORD: {{ .Values.secrets.mysqlPassword | quote }}
  WOOCOMMERCE_CONSUMER_KEY: {{ .Values.secrets.wooConsumerKey | quote }}
  WOOCOMMERCE_CONSUMER_SECRET: {{ .Values.secrets.wooConsumerSecret | quote }}
