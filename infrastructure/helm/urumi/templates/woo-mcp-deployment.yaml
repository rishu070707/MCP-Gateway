apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-woo-mcp
  labels:
    app.kubernetes.io/name: urumi
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: woo-mcp
spec:
  replicas: {{ .Values.wooMcp.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: urumi
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: woo-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: urumi
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: woo-mcp
    spec:
      securityContext:
        {{- toYaml .Values.wooMcp.securityContext | nindent 8 }}
      containers:
        - name: woo-mcp
          image: "{{ .Values.wooMcp.image.repository }}:{{ .Values.wooMcp.image.tag }}"
          imagePullPolicy: {{ .Values.wooMcp.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8001
              protocol: TCP
          env:
            - name: PORT
              value: "8001"
            - name: WOOCOMMERCE_URL
              value: "http://{{ .Release.Name }}-wordpress:80"
            - name: WOOCOMMERCE_CONSUMER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: WOOCOMMERCE_CONSUMER_KEY
            - name: WOOCOMMERCE_CONSUMER_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: WOOCOMMERCE_CONSUMER_SECRET
          livenessProbe:
            {{- toYaml .Values.wooMcp.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.wooMcp.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.wooMcp.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-woo-mcp
  labels:
    app.kubernetes.io/name: urumi
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: woo-mcp
spec:
  type: {{ .Values.wooMcp.service.type }}
  ports:
    - port: {{ .Values.wooMcp.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: urumi
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: woo-mcp
