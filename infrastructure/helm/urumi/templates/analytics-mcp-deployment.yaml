apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-analytics-mcp
  labels:
    app.kubernetes.io/name: urumi
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: analytics-mcp
spec:
  replicas: {{ .Values.analyticsMcp.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: urumi
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: analytics-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: urumi
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: analytics-mcp
    spec:
      securityContext:
        {{- toYaml .Values.analyticsMcp.securityContext | nindent 8 }}
      containers:
        - name: analytics-mcp
          image: "{{ .Values.analyticsMcp.image.repository }}:{{ .Values.analyticsMcp.image.tag }}"
          imagePullPolicy: {{ .Values.analyticsMcp.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8003
              protocol: TCP
          env:
            - name: PORT
              value: "8003"
          livenessProbe:
            {{- toYaml .Values.analyticsMcp.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.analyticsMcp.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.analyticsMcp.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-analytics-mcp
  labels:
    app.kubernetes.io/name: urumi
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: analytics-mcp
spec:
  type: {{ .Values.analyticsMcp.service.type }}
  ports:
    - port: {{ .Values.analyticsMcp.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: urumi
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: analytics-mcp
